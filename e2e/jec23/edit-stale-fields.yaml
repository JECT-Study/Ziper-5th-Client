# Before running: POST /_reset?staleEditReply=1 on the fixture.
# A 200 PATCH that echoes the old memo and tags must not count as saved; the status check recovers.
appId: com.ject.ziper
---
- runFlow: ../subflows/start-dev-client.yaml
- extendedWaitUntil:
    visible: 내 보드
    timeout: 90000
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: ziper://web?path=%2Fproducts%2F8
- extendedWaitUntil:
    visible: 린넨 블라우스
    timeout: 15000
- tapOn: 상품 관리
- tapOn: 상품 수정
- extendedWaitUntil:
    visible: '한 줄 메모\(선택\) 지우기'
    timeout: 10000
- tapOn: ^봄$
- tapOn: '한 줄 메모\(선택\) 지우기'
- inputText: Updated memo
- hideKeyboard
- tapOn: 수정 완료
- extendedWaitUntil:
    visible: 현재 상태 확인
    timeout: 10000
- assertNotVisible: 수정 완료
- tapOn: 현재 상태 확인
- extendedWaitUntil:
    notVisible: 현재 상태 확인
    timeout: 10000
- assertVisible: Updated memo
- assertVisible: ^봄$
- assertVisible: ^가을$
- assertVisible: 담긴 보드 · 2개
- assertVisible: ^29,000원$
