# Before running: POST /_reset?staleEditReply=1 on the fixture.
appId: com.ject.ziper
---
- runFlow: ../subflows/start-dev-client.yaml
- extendedWaitUntil:
    visible: 내 보드
    timeout: 90000
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: ziper://web?path=%2Fboards%2F1
- extendedWaitUntil:
    visible: 린넨 블라우스
    timeout: 15000
- tapOn: 린넨 블라우스
- tapOn: 상품 관리
- tapOn: 상품 수정
- extendedWaitUntil:
    visible: 수정 완료
    timeout: 10000
- swipe:
    start: 55%,76%
    end: 55%,35%
    duration: 450
- tapOn: '^기본 보드(\s*3개)?$'
- tapOn: 수정 완료
- extendedWaitUntil:
    visible: 현재 상태 확인
    timeout: 10000
- assertNotVisible: 수정 완료
- tapOn: 현재 상태 확인
- extendedWaitUntil:
    visible: 담긴 보드 · 1개
    timeout: 10000
- tapOn: 뒤로 가기
- extendedWaitUntil:
    visible: 플리츠 스커트
    timeout: 10000
- assertNotVisible: 린넨 블라우스
