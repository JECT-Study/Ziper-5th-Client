    timeout: 10000
- tapOn: 오버핏 울 블렌드 니트 가디건
- tapOn: 상품 관리
- tapOn: 상품 수정
- extendedWaitUntil:
    visible: 수정 완료
    timeout: 10000
- swipe:
    start: 55%,76%
    end: 55%,35%
    duration: 450
- tapOn: '^기본 보드(\s*2개)?$'
- tapOn: 수정 완료
- extendedWaitUntil:
    visible: 담긴 보드 · 2개
    timeout: 10000
- tapOn: 뒤로 가기
- extendedWaitUntil:
    visible: 린넨 블라우스
