    visible: 오래된 순
    timeout: 10000
- tapOn: 오래된 순
- tapOn: 오버핏 울 블렌드 니트 가디건
- tapOn: 상품 관리
- tapOn: 상품 수정
- extendedWaitUntil:
    visible: 수정 완료
    timeout: 10000
- swipe:
    start: 55%,76%
    end: 55%,35%
    duration: 450
- tapOn: '^기본 보드(\s*3개)?$'
- tapOn: 수정 완료
- extendedWaitUntil:
    visible: 담긴 보드 · 1개
    timeout: 10000
- tapOn: 뒤로 가기
