# Before each run: POST /_reset?dropEditBeforeCommit=1 on the fixture.
# Add &failEditStatusRead=1 to exercise a retryable status-read 404 before reconciliation.
# Add &mirrorWhileEditing=1 to verify a new mirrored file does not block manual retry.
# Add &unicodeProductText=1 to retain the seeded title and memo's non-breaking spaces.
appId: com.ject.ziper
---
- runFlow: ../subflows/start-dev-client.yaml
- extendedWaitUntil:
    visible: 내 보드
    timeout: 90000
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: ziper://web?path=%2Fboards%2F1
- extendedWaitUntil:
    visible: 린넨 블라우스
    timeout: 15000
- tapOn: 린넨 블라우스
- tapOn: 상품 관리
- tapOn: 상품 수정
- extendedWaitUntil:
    visible: 수정 완료
    timeout: 10000
- tapOn: 봄
- tapOn: 수정 완료
- extendedWaitUntil:
    visible: '수정 결과를 확인할 수 없어요.*'
    timeout: 10000
- tapOn: 현재 상태 확인
- extendedWaitUntil:
    visible: '현재 상태를 불러오지 못했어요.*|조회한 정보에 수정 내용이 아직 없어요.*'
    timeout: 10000
- runFlow:
    when:
      visible: '현재 상태를 불러오지 못했어요.*'
    commands:
      - assertNotVisible: 수정 완료
      - tapOn: 현재 상태 확인
- extendedWaitUntil:
    visible: '조회한 정보에 수정 내용이 아직 없어요.*'
    timeout: 10000
- tapOn: 수정 완료
- extendedWaitUntil:
    visible: 원본 쇼핑몰로 이동
    timeout: 10000
- assertVisible: 봄
- assertNotVisible: 수정 완료
