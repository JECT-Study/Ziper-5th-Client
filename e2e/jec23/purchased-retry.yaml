# Before running: POST /_reset?emptyPurchased=1&failPurchasedOnce=first on the fixture.
appId: com.ject.ziper
---
- runFlow: ../subflows/start-dev-client.yaml
- extendedWaitUntil:
    visible: 내 보드
    timeout: 90000
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: ziper://web?path=%2Fproducts%2Fpurchased
- extendedWaitUntil:
    visible: 목록 다시 불러오기
    timeout: 15000
- assertVisible: 구매 완료 목록
- tapOn: 목록 다시 불러오기
- extendedWaitUntil:
    visible: '구매 완료한 상품이 없어요\.'
    timeout: 10000
- assertNotVisible: 더 불러오기
- tapOn: 뒤로 가기
- extendedWaitUntil:
    visible: 내 보드
    timeout: 10000
