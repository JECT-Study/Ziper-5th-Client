# Before running: POST /_reset?unsignedEditImage=1 on the fixture.
appId: com.ject.ziper
---
- runFlow: ../subflows/start-dev-client.yaml
- extendedWaitUntil:
    visible: 내 보드
    timeout: 90000
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: ziper://products/8
- extendedWaitUntil:
    visible: 린넨 블라우스
    timeout: 15000
- assertNotVisible: '대표 이미지를 불러올 수 없어 기본 이미지로 대체했어요.*'
- tapOn: 상품 관리
- tapOn: 상품 수정
- extendedWaitUntil:
    visible: 수정 완료
    timeout: 10000
- tapOn: 수정 완료
- extendedWaitUntil:
    visible: 원본 쇼핑몰로 이동
    timeout: 10000
- assertNotVisible: 수정 완료
# Use the persistent image. Maestro can miss the 2.5-second toast during post-tap settling.
- assertVisible: '.*(기본 상품 이미지|unavailable-image).*'
