# Reset with expireSessionOnEdit=1 or deleteBoardOnEdit=1&expireOnBoardChoicesRefresh=1.
appId: com.ject.ziper
---
- runFlow: ../subflows/start-dev-client.yaml
- extendedWaitUntil:
    visible: 내 보드
    timeout: 90000
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: ziper://web?path=%2Fproducts%2F8
- extendedWaitUntil:
    visible: 린넨 블라우스
    timeout: 15000
- tapOn: 상품 관리
- tapOn: 상품 수정
- extendedWaitUntil:
    visible: 수정 완료
    timeout: 10000
- tapOn: 봄
- tapOn: 수정 완료
# The toast is transient; Chromium verifies its text. Here verify the stable blocked state.
- extendedWaitUntil:
    notVisible: 수정 완료
    timeout: 10000
- assertVisible: 취소
- assertNotVisible: 현재 상태 확인
- assertNotVisible: 로그인 화면으로 이동
- tapOn: 취소
- extendedWaitUntil:
    notVisible: 상품 수정
    timeout: 10000
- assertVisible: 상품 상세
- assertNotVisible: 원본 쇼핑몰로 이동
