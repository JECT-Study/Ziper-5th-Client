# Before running: POST /_reset?auth=email&expireSessionOnPurchase=1 on the loopback fixture.
appId: com.ject.ziper
---
- runFlow: ../subflows/start-dev-client.yaml
- runFlow: subflows/sign-in.yaml
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: ziper://web?path=%2Fboards%2F1
- extendedWaitUntil:
    visible: 오버핏 울 블렌드 니트 가디건
    timeout: 15000
- tapOn: 오버핏 울 블렌드 니트 가디건
- tapOn: 상품 관리
- tapOn: 구매 완료
- tapOn: 이동하기
- extendedWaitUntil:
    visible: 로그인 화면으로 이동
    timeout: 15000
- assertNotVisible: 구매 완료 목록
- tapOn: 로그인 화면으로 이동
- runFlow: subflows/sign-in.yaml
- tapOn: ^기본 보드$
- extendedWaitUntil:
    visible: 가격 낮은 순
    timeout: 15000
- tapOn: 가격 낮은 순
# Asserting that the card is still in the ordinary board rules out a purchase on sign-in.
- extendedWaitUntil:
    visible: 오버핏 울 블렌드 니트 가디건
    timeout: 15000
- tapOn: 오버핏 울 블렌드 니트 가디건
- tapOn: 상품 관리
- tapOn: 구매 완료
- tapOn: 이동하기
- extendedWaitUntil:
    visible: 구매 완료 목록
    timeout: 15000
- assertVisible: 오버핏 울 블렌드 니트 가디건
- tapOn: 뒤로 가기
- extendedWaitUntil:
    visible: 린넨 블라우스
    timeout: 15000
- assertNotVisible: 오버핏 울 블렌드 니트 가디건
