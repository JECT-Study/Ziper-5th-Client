# JEC-23 상품 상세: 상품 관리 바텀시트 → 구매 완료 확인 → 구매 완료 목록 → 상세에 구매 완료 상태 표시.
# JEC-23 fixture 를 쓴다: 흐름마다 POST /_reset (로그인 상태) 후 실행한다.
appId: com.ject.ziper
---
- runFlow: ../subflows/launch.yaml
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: ziper://web?path=%2Fproducts%2F7
- extendedWaitUntil:
    visible: 오버핏 울 블렌드 니트 가디건
    timeout: 15000
- tapOn: 상품 관리
- tapOn: 구매 완료
- tapOn: 이동하기
- extendedWaitUntil:
    visible: 구매 완료 목록
    timeout: 10000
- tapOn: 오버핏 울 블렌드 니트 가디건
- extendedWaitUntil:
    visible: '.*구매 완료한 상품이에요'
    timeout: 10000
- assertNotVisible: 이동하기
- tapOn: 상품 관리
- assertNotVisible: 구매 완료
- assertVisible: 상품 수정
