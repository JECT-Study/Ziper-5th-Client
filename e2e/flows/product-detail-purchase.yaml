# JEC-23 상품 상세: 상품 관리 바텀시트 → 구매 완료 확인 → 상세에 구매 완료 상태 표시.
# When using the JEC-23 fixture: POST /_reset?expiredSession=1 before this signed-out preview.
# 웹 dev 서버의 프리뷰 fixture(?preview=normal)를 쓰므로 백엔드가 필요 없다.
# 구매 완료 목록 화면 이동은 e2e/jec23/ 의 HTTP fixture 시나리오에서 확인한다.
appId: com.ject.ziper
---
- runFlow: ../subflows/launch.yaml
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: ziper://web?path=%2Fproducts%2F1%3Fpreview%3Dnormal
- extendedWaitUntil:
    visible: 오버핏 울 블렌드 니트 가디건
    timeout: 15000
- tapOn: 상품 관리
- tapOn: 구매 완료
- tapOn: 이동하기
- extendedWaitUntil:
    visible: '.*구매 완료한 상품이에요'
    timeout: 10000
- assertNotVisible: 이동하기
- tapOn: 상품 관리
- assertNotVisible: 구매 완료
- assertVisible: 상품 수정
