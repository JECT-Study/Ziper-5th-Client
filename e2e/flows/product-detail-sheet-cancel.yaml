# 상품 관리 시트를 닫으면 상세 화면이 그대로 남고 구매 확인 창이 뜨지 않는다.
# JEC-23 fixture 를 쓴다: 흐름마다 POST /_reset (로그인 상태) 후 실행한다.
appId: com.ject.ziper
---
- runFlow: ../subflows/launch.yaml
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      LINK: ziper://web?path=%2Fproducts%2F7
- extendedWaitUntil:
    visible: 오버핏 울 블렌드 니트 가디건
    timeout: 15000
- tapOn: 상품 관리
- tapOn: 닫기
- assertNotVisible: 닫기
- assertNotVisible: 이동하기
- assertVisible: 상품 관리
