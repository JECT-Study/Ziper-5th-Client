packages:
  - 'apps/*'
  - 'packages/*'

overrides:
  vite@*: npm:@voidzero-dev/vite-plus-core@1.5.0
  vitest@*: 5.1.0

onlyBuiltDependencies:
  - esbuild

# Vite+ core uses its own version numbering for Vite-compatible APIs.
peerDependencyRules:
  allowedVersions:
    '@tanstack/react-start@1.169.4>vite': '1.5.0'
    '@tanstack/start-plugin-core@1.171.55>vite': '1.5.0'
    '@tanstack/router-plugin@1.168.48>vite': '1.5.0'
    '@vanilla-extract/vite-plugin@5.2.6>vite': '1.5.0'
    '@vitejs/plugin-react@6.2.1>vite': '1.5.0'
    'vitefu@1.1.3>vite': '1.5.0'
    'vitest@5.1.0>vite': '1.5.0'
    '@vitest/mocker@5.1.0>vite': '1.5.0'
    '@vitest/browser@5.1.0>vite': '1.5.0'
